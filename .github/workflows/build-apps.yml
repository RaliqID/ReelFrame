name: Build Apps (Windows / macOS / Linux)

# Builds a real, installable app for every OS.
#   • Trigger automatically on a version tag (v*), or manually from the Actions tab.
#   • Download the finished apps from the run's "Artifacts" section, or from
#     the GitHub Release when triggered by a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows ---
  windows:
    name: Windows (.exe + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download default model
        run: python download_models.py default
        continue-on-error: true

      - name: Build portable app
        run: python -m PyInstaller ReelFrame.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ReelFrame.iss'
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReelFrame-Windows
          path: |
            dist/ReelFrame/**
            installer/output/*.exe
          if-no-files-found: warn

  # ------------------------------------------------------------------ macOS ---
  macos:
    name: macOS (.app + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision           # Apple Silicon / MPS build
          pip install -r requirements.txt
          pip install "pywebview[macos]" pyobjc-framework-WebKit pyinstaller

      - name: Download default model
        run: python download_models.py default
        continue-on-error: true

      - name: Generate .icns icon
        run: |
          mkdir -p web/icon.iconset
          for s in 16 32 64 128 256 512 1024; do
            sips -z $s $s web/icon.png --out "web/icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d web/icon.png --out "web/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns web/icon.iconset -o web/icon.icns
          rm -rf web/icon.iconset

      - name: Build ReelFrame.app
        run: python -m PyInstaller ReelFrame-macos.spec --noconfirm --clean

      - name: Package .dmg
        run: |
          mkdir -p installer/output
          hdiutil create -volname "ReelFrame" \
            -srcfolder dist/ReelFrame.app \
            -ov -format UDZO \
            installer/output/ReelFrame-2.0.0-macos.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReelFrame-macOS
          path: |
            dist/ReelFrame.app/**
            installer/output/*.dmg
          if-no-files-found: warn

  # ------------------------------------------------------------------ Linux ---
  linux:
    name: Linux (bundle + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System libraries (pywebview GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libfuse2 libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pywebview pyinstaller

      - name: Download default model
        run: python download_models.py default
        continue-on-error: true

      - name: Build bundle
        run: python -m PyInstaller ReelFrame.spec --noconfirm --clean

      - name: Build AppImage
        run: |
          APPDIR="$PWD/build/ReelFrame.AppDir"
          rm -rf "$APPDIR"; mkdir -p "$APPDIR/usr/bin"
          cp -r dist/ReelFrame/* "$APPDIR/usr/bin/"
          cp web/icon.png "$APPDIR/reelframe.png"
          cat > "$APPDIR/ReelFrame.desktop" <<'EOF'
          [Desktop Entry]
          Name=ReelFrame
          Exec=ReelFrame
          Icon=reelframe
          Type=Application
          Categories=AudioVideo;Graphics;
          Comment=Local 4K AI Video & Image Upscaler
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/ReelFrame" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          mkdir -p installer/output
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" installer/output/ReelFrame-2.0.0-x86_64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReelFrame-Linux
          path: |
            dist/ReelFrame/**
            installer/output/*.AppImage
          if-no-files-found: warn

  # --------------------------------------------------------------- Release ----
  release:
    name: Publish Release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what we will publish
        run: find artifacts -type f | head -50

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ReelFrame-Windows/installer/output/*.exe
            artifacts/ReelFrame-macOS/installer/output/*.dmg
            artifacts/ReelFrame-Linux/installer/output/*.AppImage
          generate_release_notes: true
